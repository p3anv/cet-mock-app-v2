<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CET Mock Test – Take Test</title>
  <link rel="stylesheet" href="test.css">
</head>
<body>
<div id="testApp"></div>

<script>
  // ---------- ALL ORIGINAL JAVASCRIPT (except theme toggle) ----------
  const CURRENT_STORAGE_KEY = 'cet_mock_tests_v3';
  const OLD_STORAGE_KEY = 'cet_mock_tests_v2';
  const ATTEMPTS_KEY = 'cet_test_attempts';
  const THEME_KEY = 'cetprep-theme'; // Match index.html

  function getAllTests() {
    let raw = localStorage.getItem(CURRENT_STORAGE_KEY);
    if (raw) { try { return JSON.parse(raw); } catch(e) { return []; } }
    const oldRaw = localStorage.getItem(OLD_STORAGE_KEY);
    if (oldRaw) {
      try { const old = JSON.parse(oldRaw); if (Array.isArray(old) && old.length) { localStorage.setItem(CURRENT_STORAGE_KEY, JSON.stringify(old)); return old; } } catch(e) {}
    }
    return [];
  }
  function getTestById(id) { return getAllTests().find(t => t.id === id); }
  function saveAttempt(attempt) { const attempts = getAllAttempts(); attempts.push(attempt); localStorage.setItem(ATTEMPTS_KEY, JSON.stringify(attempts)); }
  function getAllAttempts() { const raw = localStorage.getItem(ATTEMPTS_KEY); return raw ? JSON.parse(raw) : []; }

  function showToast(message, type = 'success', title = '') {
    const container = document.getElementById('toastContainer') || (() => { const div = document.createElement('div'); div.id = 'toastContainer'; div.className = 'toast-container'; document.body.appendChild(div); return div; })();
    const icons = { success: '✓', error: '✕', info: 'i', warning: '!' };
    const titles = { success: 'Success', error: 'Error', info: 'Info', warning: 'Warning' };
    const toast = document.createElement('div'); toast.className = `toast ${type}`;
    toast.innerHTML = `<div class="toast-icon">${icons[type]}</div><div class="toast-content"><div class="toast-title">${escapeHtml(title || titles[type])}</div><div class="toast-message">${escapeHtml(message)}</div></div>`;
    container.appendChild(toast); setTimeout(() => toast.remove(), 4000);
  }

  function showExplanationToast(explanation, questionText) {
    const container = document.getElementById('explanationToastContainer') || (() => { const div = document.createElement('div'); div.id = 'explanationToastContainer'; div.className = 'explanation-toast-container'; document.body.appendChild(div); return div; })();
    const toast = document.createElement('div'); toast.className = 'explanation-toast';
    toast.innerHTML = `<div class="explanation-title">Explanation</div><div style="font-size:0.85rem; color:var(--color-text-secondary);">${escapeHtml(questionText.substring(0, 80))}${questionText.length > 80 ? '...' : ''}</div><div class="explanation-text">${escapeHtml(explanation)}</div>`;
    container.appendChild(toast); setTimeout(() => toast.remove(), 5000);
  }

  function showConfirmationModal(onConfirm, unansweredCount) {
    const modal = document.createElement('div'); modal.className = 'modal-overlay';
    let warningText = unansweredCount > 0 ? `<p style="color: var(--color-warning); margin-bottom: 1rem;">You have ${unansweredCount} unanswered question(s).</p>` : '';
    modal.innerHTML = `<div class="modal-box"><h3>Submit test?</h3>${warningText}<p>Are you sure you want to submit? You won't be able to change your answers after submission.</p><div class="modal-actions"><button class="btn btn-secondary" id="cancelSubmit">Cancel</button><button class="btn btn-danger" id="confirmSubmit">Yes, submit</button></div></div>`;
    document.body.appendChild(modal);
    const cancelHandler = () => { modal.remove(); showToast('Submission cancelled.', 'info'); document.removeEventListener('keydown', escHandler); };
    const confirmHandler = () => { modal.remove(); onConfirm(); document.removeEventListener('keydown', escHandler); };
    const escHandler = (e) => { if (e.key === 'Escape') cancelHandler(); };
    document.getElementById('cancelSubmit').addEventListener('click', cancelHandler);
    document.getElementById('confirmSubmit').addEventListener('click', confirmHandler);
    document.addEventListener('keydown', escHandler);
  }

  // ========== GRAPH RENDERING (unchanged) ==========
  function setCanvasSize(canvas, width, height) {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = `${width}px`;
    canvas.style.height = `${height}px`;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    return ctx;
  }

  function renderBarGraph(canvasId, title, data) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const labels = Object.keys(data);
    const values = Object.values(data);
    const width = 500, height = 300;
    const ctx = setCanvasSize(canvas, width, height);
    ctx.clearRect(0, 0, width, height);
    const barWidth = (width / labels.length) * 0.6;
    const startX = (width / labels.length - barWidth) / 2;
    const maxVal = Math.max(...values, 1);
    for (let i = 0; i < labels.length; i++) {
      const x = i * (width / labels.length) + startX;
      const barHeight = (values[i] / maxVal) * (height - 60);
      ctx.fillStyle = '#4f46e5';
      ctx.fillRect(x, height - barHeight - 30, barWidth, barHeight);
      ctx.fillStyle = '#333';
      ctx.font = '12px sans-serif';
      ctx.fillText(labels[i], x + barWidth/4, height - 10);
    }
    ctx.fillStyle = '#000';
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText(title, 10, 20);
  }

  function renderLineGraph(canvasId, title, data) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const labels = Object.keys(data);
    const values = Object.values(data);
    const width = 500, height = 300;
    const ctx = setCanvasSize(canvas, width, height);
    ctx.clearRect(0, 0, width, height);
    const maxVal = Math.max(...values, 1);
    const stepX = width / (labels.length - 1 || 1);
    const points = [];
    for (let i = 0; i < labels.length; i++) {
      const x = i * stepX;
      const y = height - 30 - (values[i] / maxVal) * (height - 60);
      points.push({ x, y });
    }
    ctx.beginPath();
    ctx.strokeStyle = '#16a34a';
    ctx.lineWidth = 2;
    ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
    ctx.stroke();
    for (let i = 0; i < points.length; i++) {
      ctx.fillStyle = '#d97706';
      ctx.beginPath();
      ctx.arc(points[i].x, points[i].y, 4, 0, 2 * Math.PI);
      ctx.fill();
      ctx.fillStyle = '#333';
      ctx.font = '10px sans-serif';
      ctx.fillText(labels[i], points[i].x - 5, height - 10);
    }
    ctx.fillStyle = '#000';
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText(title, 10, 20);
  }

  function renderPieChart(canvasId, title, data) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const values = Object.values(data);
    const labels = Object.keys(data);
    const total = values.reduce((a, b) => a + b, 0);
    const width = 500, height = 300;
    const ctx = setCanvasSize(canvas, width, height);
    ctx.clearRect(0, 0, width, height);
    const centerX = width / 2, centerY = height / 2, radius = 100;
    let startAngle = -Math.PI / 2;
    const colors = ['#4f46e5', '#16a34a', '#d97706', '#dc2626', '#8b5cf6', '#0284c7'];
    for (let i = 0; i < values.length; i++) {
      const angle = (values[i] / total) * 2 * Math.PI;
      const endAngle = startAngle + angle;
      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.arc(centerX, centerY, radius, startAngle, endAngle);
      ctx.closePath();
      ctx.fillStyle = colors[i % colors.length];
      ctx.fill();
      startAngle = endAngle;
    }
    ctx.fillStyle = '#000';
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText(title, 10, 20);
  }

  function renderTable(canvasId, title, rows) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const width = 500, height = 300;
    const ctx = setCanvasSize(canvas, width, height);
    ctx.clearRect(0, 0, width, height);
    ctx.font = '12px sans-serif';
    const colWidth = width / Math.max(...rows.map(r => r.length));
    const rowHeight = 25;
    for (let r = 0; r < rows.length; r++) {
      for (let c = 0; c < rows[r].length; c++) {
        const x = c * colWidth + 5;
        const y = r * rowHeight + 20;
        ctx.fillStyle = r === 0 ? '#000' : '#333';
        ctx.fillText(rows[r][c], x, y);
      }
    }
    ctx.fillStyle = '#000';
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText(title, 10, 20);
  }

  function renderParagraphWithVisualizations(paragraphText, uniqueId) {
    if (!paragraphText) return '';
    if (paragraphText.includes('[BARGRAPH]')) {
      const lines = paragraphText.split('\n');
      const title = lines[1] || 'Chart';
      const data = {};
      for (let i = 2; i < lines.length; i++) {
        const [key, val] = lines[i].split(':');
        if (key && val) {
          let numVal = parseFloat(val.trim());
          if (isNaN(numVal)) {
            return `<div>${escapeHtml(paragraphText)}</div>`;
          }
          data[key.trim()] = numVal;
        }
      }
      const canvasId = `barChart_${uniqueId}`;
      setTimeout(() => renderBarGraph(canvasId, title, data), 0);
      return `<div class="chart-container"><canvas id="${canvasId}"></canvas></div>`;
    }
    if (paragraphText.includes('[LINEGRAPH]')) {
      const lines = paragraphText.split('\n');
      const title = lines[1] || 'Chart';
      const data = {};
      for (let i = 2; i < lines.length; i++) {
        const [key, val] = lines[i].split(':');
        if (key && val) {
          let numVal = parseFloat(val.trim());
          if (isNaN(numVal)) {
            return `<div>${escapeHtml(paragraphText)}</div>`;
          }
          data[key.trim()] = numVal;
        }
      }
      const canvasId = `lineChart_${uniqueId}`;
      setTimeout(() => renderLineGraph(canvasId, title, data), 0);
      return `<div class="chart-container"><canvas id="${canvasId}"></canvas></div>`;
    }
    if (paragraphText.includes('[PIEGRAPH]')) {
      const lines = paragraphText.split('\n');
      const title = lines[1] || 'Chart';
      const data = {};
      for (let i = 2; i < lines.length; i++) {
        const [key, val] = lines[i].split(':');
        if (key && val) {
          let numVal = parseFloat(val.trim());
          if (isNaN(numVal)) {
            return `<div>${escapeHtml(paragraphText)}</div>`;
          }
          data[key.trim()] = numVal;
        }
      }
      const canvasId = `pieChart_${uniqueId}`;
      setTimeout(() => renderPieChart(canvasId, title, data), 0);
      return `<div class="chart-container"><canvas id="${canvasId}"></canvas></div>`;
    }
    if (paragraphText.includes('[TABLE]')) {
      const lines = paragraphText.split('\n');
      const title = lines[1] || 'Table';
      const rows = [];
      for (let i = 2; i < lines.length; i++) {
        const cols = lines[i].split('|').map(c => c.trim());
        if (cols.length > 1) rows.push(cols);
      }
      if (rows.length === 0) return `<div>${escapeHtml(paragraphText)}</div>`;
      const canvasId = `tableChart_${uniqueId}`;
      setTimeout(() => renderTable(canvasId, title, rows), 0);
      return `<div class="chart-container"><canvas id="${canvasId}"></canvas></div>`;
    }
    return `<div>${escapeHtml(paragraphText)}</div>`;
  }

  // ---------- THEME TOGGLE (for test page) ----------
  function getThemeToggleHTML() {
    // Check localStorage directly since this runs before setupThemeToggle initializes body class
    const savedTheme = localStorage.getItem(THEME_KEY);
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isLight = savedTheme ? savedTheme === 'light' : !prefersDark;
    const icon = isLight
      ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m4.93 19.07 1.41-1.41"/><path d="m17.66 6.34 1.41-1.41"/>'
      : '<path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.5 6.5 0 0 0 21 12.8Z"/>';
    return `<button class="theme-toggle-exam" id="themeToggleExam" aria-label="Toggle theme"><svg class="icon" viewBox="0 0 24 24">${icon}</svg></button>`;
  }

  function setupThemeToggle() {
    const toggle = document.getElementById('themeToggleExam');
    if (!toggle) return;

    // Initialize theme from localStorage on load (CSS uses .light class for light mode)
    const savedTheme = localStorage.getItem(THEME_KEY);
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isLight = savedTheme ? savedTheme === 'light' : !prefersDark;
    document.body.classList.toggle('light', isLight);

    const handler = () => {
      const isLight = !document.body.classList.contains('light');
      document.body.classList.toggle('light', isLight);
      localStorage.setItem(THEME_KEY, isLight ? 'light' : 'dark');
      const icon = toggle.querySelector('svg');
      if (icon) {
        icon.innerHTML = isLight
          ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m4.93 19.07 1.41-1.41"/><path d="m17.66 6.34 1.41-1.41"/>'
          : '<path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.5 6.5 0 0 0 21 12.8Z"/>';
      }
      showToast(`${isLight ? 'Light' : 'Dark'} mode`, 'info');
    };
    toggle.addEventListener('click', handler);
    window.__themeToggleCleanup = () => toggle.removeEventListener('click', handler);
  }

  // ---------- MAIN RENDER ----------
  function renderTestInterface(test) {
    let currentIndex = 0;
    let answers = new Array(test.questions.length).fill(null);
    let markedForReview = new Array(test.questions.length).fill(false);
    let timerInterval = null;
    let timeSeconds = 0;
    const app = document.getElementById('testApp');
    const submittedRef = { submitted: false };
    const cleanupFns = [];
    enableBeforeUnload(submittedRef);
    function updateTimerDisplay() {
      const mins = Math.floor(timeSeconds / 60);
      const secs = timeSeconds % 60;
      const timerSpan = document.getElementById('timerDisplay');
      if (timerSpan) timerSpan.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }
    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!submittedRef.submitted) {
          timeSeconds++;
          updateTimerDisplay();
        }
      }, 1000);
    }
    cleanupFns.push(() => { if (timerInterval) clearInterval(timerInterval); });
    function renderQuestionNav() {
      const navContainer = document.getElementById('navGrid');
      if (!navContainer) return;
      navContainer.innerHTML = '';
      for (let idx = 0; idx < test.questions.length; idx++) {
        const btn = document.createElement('button');
        btn.innerText = idx + 1;
        btn.classList.add('nav-btn');
        if (answers[idx] !== null) btn.classList.add('answered');
        if (markedForReview[idx]) btn.classList.add('marked');
        if (idx === currentIndex) btn.classList.add('current');
        const handler = () => {
          currentIndex = idx;
          renderMainQuestion();
          renderQuestionNav();
        };
        btn.addEventListener('click', handler);
        cleanupFns.push(() => btn.removeEventListener('click', handler));
        navContainer.appendChild(btn);
      }
    }
    function renderMainQuestion() {
      const q = test.questions[currentIndex];
      const mainPanel = document.getElementById('mainPanel');
      if (!mainPanel) return;
      const selectedVal = answers[currentIndex];
      const uniqueId = `q${currentIndex}_${crypto.randomUUID ? crypto.randomUUID() : Date.now() + '_' + Math.random().toString(36).substr(2, 8)}`;
      const visualHtml = q.paragraph ? renderParagraphWithVisualizations(q.paragraph, uniqueId) : '';
      mainPanel.innerHTML = `
        <div class="question-card">
          ${visualHtml ? `<div class="paragraph-box">${visualHtml}</div>` : ''}
          <div class="question-text">${escapeHtml(q.question)}</div>
          <div class="options-list" id="optionsList">
            ${q.options.map((opt, optIdx) => `
              <div class="option-item" data-opt-index="${optIdx}">
                <input type="radio" name="questionOption" value="${optIdx}" id="opt_${optIdx}" ${selectedVal === optIdx ? 'checked' : ''}>
                <label for="opt_${optIdx}" style="flex:1; cursor:pointer;">${escapeHtml(opt)}</label>
              </div>
            `).join('')}
          </div>
          <div class="action-buttons">
            <button class="action-btn" id="prevBtn">Previous</button>
            <button class="action-btn" id="nextBtn">Next</button>
            <button class="action-btn" id="markBtn">${markedForReview[currentIndex] ? 'Marked' : 'Mark for review'}</button>
            <button class="action-btn" id="explainBtn">Show explanation</button>
          </div>
        </div>
      `;
      document.querySelectorAll('input[name="questionOption"]').forEach(radio => {
        const handler = (e) => {
          const chosen = parseInt(e.target.value);
          answers[currentIndex] = chosen;
          renderQuestionNav();
        };
        radio.addEventListener('change', handler);
        cleanupFns.push(() => radio.removeEventListener('change', handler));
      });
      const prevHandler = () => {
        if (currentIndex > 0) { currentIndex--; renderMainQuestion(); renderQuestionNav(); }
      };
      document.getElementById('prevBtn')?.addEventListener('click', prevHandler);
      cleanupFns.push(() => document.getElementById('prevBtn')?.removeEventListener('click', prevHandler));
      const nextHandler = () => {
        if (currentIndex < test.questions.length - 1) { currentIndex++; renderMainQuestion(); renderQuestionNav(); }
      };
      document.getElementById('nextBtn')?.addEventListener('click', nextHandler);
      cleanupFns.push(() => document.getElementById('nextBtn')?.removeEventListener('click', nextHandler));
      const markHandler = () => {
        markedForReview[currentIndex] = !markedForReview[currentIndex];
        renderMainQuestion();
        renderQuestionNav();
        showToast(`Question ${currentIndex + 1} ${markedForReview[currentIndex] ? 'marked' : 'unmarked'}`, 'info');
      };
      document.getElementById('markBtn')?.addEventListener('click', markHandler);
      cleanupFns.push(() => document.getElementById('markBtn')?.removeEventListener('click', markHandler));
      const explainHandler = () => {
        showExplanationToast(test.questions[currentIndex].explanation, test.questions[currentIndex].question);
      };
      document.getElementById('explainBtn')?.addEventListener('click', explainHandler);
      cleanupFns.push(() => document.getElementById('explainBtn')?.removeEventListener('click', explainHandler));
    }
    function submitAndShowResults() {
      if (submittedRef.submitted) return;
      submittedRef.submitted = true;
      if (timerInterval) clearInterval(timerInterval);
      let correctCount = 0;
      const resultsDetail = [];
      for (let idx = 0; idx < test.questions.length; idx++) {
        const q = test.questions[idx];
        const userAnswer = answers[idx];
        const isCorrect = (userAnswer !== null && userAnswer === q.correct);
        if (isCorrect) correctCount++;
        resultsDetail.push({
          question: q.question,
          userAnswer: userAnswer !== null ? q.options[userAnswer] : 'Not answered',
          correctAnswer: q.options[q.correct],
          isCorrect,
          explanation: q.explanation,
          paragraph: q.paragraph || '',
          options: q.options
        });
      }
      const total = test.questions.length;
      const percentage = ((correctCount / total) * 100).toFixed(1);
      const score = correctCount;
      const attemptData = { testId: test.id, testName: test.name, score, total, percentage, date: new Date().toISOString(), answers };
      saveAttempt(attemptData);
      showToast(`Test submitted! Score: ${score}/${total} (${percentage}%)`, 'success', 'Test completed');
      const csvContent = generateCSV(test, resultsDetail, { score, total, percentage, date: attemptData.date, timeSeconds });
      const modalDiv = document.createElement('div');
      modalDiv.className = 'results-modal';
      modalDiv.innerHTML = `
        <div class="results-card">
          <div class="results-header"><h2><svg width="25px" height="25px" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M9 5a1 1 0 100 2h2.586l-3.293 3.293a1 1 0 101.414 1.414L13 8.414V11a1 1 0 102 0V6c0-.025 0-.05-.003-.075A1 1 0 0014 5H9zM1 14.5A1.5 1.5 0 012.5 13h3A1.5 1.5 0 017 14.5v3A1.5 1.5 0 015.5 19h-3A1.5 1.5 0 011 17.5v-3z" fill="#5C5F62"/><path d="M2.5 1A1.5 1.5 0 001 2.5V11h2V3h14v14H9v2h8.5a1.5 1.5 0 001.5-1.5v-15A1.5 1.5 0 0017.5 1h-15z" fill="#5C5F62"/></svg>       Test results</h2><p>${escapeHtml(test.name)} &bull; ${new Date().toLocaleDateString()}</p></div>
          <div class="score-summary">
            <div class="score-card correct"><div class="score-value">${correctCount}/${total}</div><div class="score-label">Correct</div></div>
            <div class="score-card incorrect"><div class="score-value">${total - correctCount}/${total}</div><div class="score-label">Incorrect</div></div>
            <div class="score-card percentage"><div class="score-value">${percentage}%</div><div class="score-label">Score</div></div>
          </div>
          <div class="results-content">
            ${resultsDetail.map((d, i) => `
              <div class="question-review-item ${d.isCorrect ? 'correct' : 'incorrect'}">
                <div class="q-text">Q${i+1}: ${escapeHtml(d.question)}</div>
                <div class="answer-detail">Your answer: ${escapeHtml(d.userAnswer)}</div>
                ${!d.isCorrect ? `<div class="answer-detail">Correct: ${escapeHtml(d.correctAnswer)}</div>` : ''}
                <div class="explanation-box"><strong>Explanation:</strong> ${escapeHtml(d.explanation)}</div>
              </div>
            `).join('')}
          </div>
          <div class="results-footer">
            <button class="btn btn-secondary" id="exportCsvBtn">

    function generateCSV(test, resultsDetail, summary) {
      const rows = [];
      rows.push(['Test Name', 'Category', 'Date', 'Time Taken (seconds)', 'Score', 'Total', 'Percentage']);
      rows.push([test.name, test.category || 'Misc', summary.date, summary.timeSeconds, summary.score, summary.total, summary.percentage + '%']);
      rows.push([]);
      rows.push(['Question #', 'Question', 'Your Answer', 'Correct Answer', 'Result', 'Options', 'Explanation', 'Paragraph/Data']);
      resultsDetail.forEach((d, i) => {
        const optionsStr = d.options.join(' | ');
        const paragraphStr = d.paragraph ? d.paragraph.replace(/\n/g, ' ') : '';
        rows.push([i + 1, d.question, d.userAnswer, d.correctAnswer, d.isCorrect ? 'Correct' : 'Incorrect', optionsStr, d.explanation, paragraphStr]);
      });
      return rows.map(row =>
        row.map(cell => {
          const str = String(cell || '');
          if (str.includes(',') || str.includes('"') || str.includes('\n')) {
            return '"' + str.replace(/"/g, '""') + '"';
          }
          return str;
        }).join(',')
      ).join('\n');
    }
    function downloadCSV(content, filename) {
      const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.style.display = 'none';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(link.href), 100);
      showToast('CSV exported successfully!', 'success');
    }
    // Build UI
    const toggleHTML = getThemeToggleHTML();
    app.innerHTML = `
      <div class="test-header">
        <div class="test-title">${escapeHtml(test.name)} <span class="test-id">ID: ${test.id.slice(-8)}</span></div>
        <div class="header-controls">
          <div class="timer"><span id="timerDisplay">00:00</span></div>
          ${toggleHTML}
          <button class="submit-btn" id="finalSubmitBtn">Submit test</button>
        </div>
      </div>
      <div class="test-container">
        <div class="question-nav">
          <h4>Navigator</h4>
          <div class="nav-grid" id="navGrid"></div>
          <div class="nav-legend">
            <span class="nav-legend-item"><span class="dot answered"></span> Answered</span>
            <span class="nav-legend-item"><span class="dot marked"></span> Marked</span>
            <span class="nav-legend-item"><span class="dot current"></span> Current</span>
          </div>
        </div>
        <div class="question-panel" id="mainPanel"></div>
      </div>
    `;
    startTimer();
    renderQuestionNav();
    renderMainQuestion();
    const submitHandler = () => {
      const unansweredCount = answers.filter(a => a === null).length;
      showConfirmationModal(() => submitAndShowResults(), unansweredCount);
    };
    document.getElementById('finalSubmitBtn')?.addEventListener('click', submitHandler);
    cleanupFns.push(() => document.getElementById('finalSubmitBtn')?.removeEventListener('click', submitHandler));
    setupThemeToggle();
    cleanupFns.push(() => { if (window.__themeToggleCleanup) window.__themeToggleCleanup(); });
    window.__testCleanup = () => cleanupFns.forEach(fn => fn());
  }

  function enableBeforeUnload(submittedRef) {
    window.addEventListener('beforeunload', (e) => {
      if (!submittedRef.submitted) {
        e.preventDefault();
        e.returnValue = '';
      }
    });
  }

  // ---------- ENTRY ----------
  const params = new URLSearchParams(window.location.search);
  const testId = params.get('id');
  if (!testId) {
    document.body.innerHTML = '<div style="padding:2rem;text-align:center;">No test ID. <a href="index.html">Go Home</a></div>';
    showToast('No test ID provided.', 'error');
  } else {
    const test = getTestById(testId);
    if (!test) {
      document.body.innerHTML = '<div style="padding:2rem;text-align:center;">Test not found. <a href="index.html">Return Home</a></div>';
      showToast('Test not found.', 'error');
    } else {
      renderTestInterface(test);
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>');
  }
